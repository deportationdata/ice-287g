name: "Scrape 287(g) agreements"

on:
  schedule:
    # hourly: ICE sometimes replaces the sheet more than once a day (the
    # archive holds am/pm pairs). The cheap-gate step below keeps unchanged
    # runs to two small requests, so this costs ice.gov almost nothing.
    # minute 17 avoids the top-of-the-hour scheduling pile-up
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          lfs: true
          fetch-depth: 0

      - name: Continue open update PR if one exists
        id: update_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # While an agreements-update PR sits unmerged, build on its branch so
          # each day's scrape lands as a new commit there. The old behavior
          # skipped the run entirely when files overlapped an open PR, which
          # silently dropped the Sep 8-11 2026 snapshots while PR #58 waited.
          open_branch=$(gh pr list --state open --json headRefName \
            --jq '[.[].headRefName | select(startswith("agreements-update"))][0] // empty')
          if [ -n "$open_branch" ]; then
            git fetch origin "$open_branch"
            git checkout -B "$open_branch" "origin/$open_branch"
            echo "Continuing open update branch: $open_branch"
            echo "branch=$open_branch" >> "$GITHUB_OUTPUT"
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
          else
            branch="agreements-update-$(date +%Y-%m-%d-%H%M%S)"
            git checkout -b "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "existing_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the ICE sheet changed (cheap gate)
        id: gate
        run: |
          # Hourly schedule, but a full scrape re-downloads every MOA PDF —
          # so first fetch just the participating-agencies sheet and compare
          # its hash to the newest snapshot. Any failure falls through to a
          # full scrape, which has its own error handling.
          ua="Mozilla/5.0 (X11; Linux aarch64) AppleWebKit/537.36"
          url=$(curl -sL --retry 3 -A "$ua" "https://www.ice.gov/identify-and-arrest/287g" \
            | grep -oiE 'href="[^"]*participatingAgencies[^"]*\.xlsx[^"]*"' \
            | head -1 | sed 's/^href="//; s/"$//' || true)
          case "$url" in
            //*) url="https:$url" ;;
            /*)  url="https://www.ice.gov$url" ;;
          esac
          if [ -z "$url" ]; then
            echo "Sheet link not found on page — running full scrape."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -sL -f --retry 3 -A "$ua" "$url" -o /tmp/gate-sheet.xlsx; then
            echo "Gate download failed — running full scrape."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_hash=$(sha256sum /tmp/gate-sheet.xlsx | cut -d' ' -f1)
          latest_dir=$(ls -d sheets/sheets_2* 2>/dev/null | sort | tail -1 || true)
          # manifest.csv is the unified manifest; download_path_log.csv is
          # its predecessor, tolerated until every branch is converted
          if [ -n "$latest_dir" ] && cat "$latest_dir"/manifest.csv "$latest_dir"/download_path_log.csv 2>/dev/null | grep -q "$new_hash"; then
            echo "Sheet unchanged (sha256 $new_hash) — skipping scrape."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sheet changed or no prior snapshot — running full scrape."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure clean working tree and save current snapshot
        if: steps.gate.outputs.changed == 'true'
        run: |
          git lfs pull
          git checkout -- .
          # the runner is persistent and a skipped run used to leave its
          # untracked snapshot folders behind, contaminating the next day's
          # diff — remove anything git doesn't track before scraping
          git clean -fd agreements/ sheets/
          mkdir -p /tmp/old-287g
          Rscript --vanilla -e '
            # this step runs before "Install R packages", so a cold runner
            # must bootstrap digest itself
            if (!requireNamespace("digest", quietly = TRUE)) {
              install.packages("digest", repos = "https://cloud.r-project.org")
            }
            suppressPackageStartupMessages(library(digest))

            snapshot <- function(base_path, out_path) {
              if (!dir.exists(base_path)) {
                saveRDS(data.frame(
                  rel_path = character(),
                  file_hash = character(),
                  stringsAsFactors = FALSE
                ), out_path)
                return()
              }

              files <- list.files(base_path, recursive = TRUE, full.names = TRUE)
              files <- files[!file.info(files)$isdir]
              rel_paths <- substring(files, nchar(base_path) + 2)
              file_hashes <- vapply(
                files,
                function(path) digest::digest(file = path, algo = "sha256"),
                character(1)
              )

              saveRDS(data.frame(
                rel_path = rel_paths,
                file_hash = unname(file_hashes),
                stringsAsFactors = FALSE
              ), out_path)
            }

            snapshot("agreements", "/tmp/old-287g/agreements.rds")
            snapshot("sheets", "/tmp/old-287g/sheets.rds")
          '

      - name: Install R packages
        if: steps.gate.outputs.changed == 'true'
        run: |
          Rscript --vanilla -e '
            pkgs <- c(
              "arrow",
              "digest",
              "dplyr",
              "fs",
              "haven",
              "httr",
              "httr2",
              "openxlsx",
              "readr",
              "readxl",
              "rvest",
              "sf",
              "sfarrow",
              "stringi",
              "stringdist",
              "stringr",
              "tidygeocoder",
              "tigris",
              "tidyr",
              "tidyverse",
              "xml2"
            )
            # the self-hosted runner keeps its library between runs; a full
            # reinstall recompiles arrow from source (~50 min), so only fetch
            # what is missing (delete the package from the library to force a
            # version refresh)
            missing <- pkgs[
              !vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)
            ]
            if (length(missing) > 0) {
              install.packages(missing, repos = "https://cloud.r-project.org")
            }
          '

      - name: Run scraper
        if: steps.gate.outputs.changed == 'true'
        run: Rscript --vanilla code/0-287g-scraper.R

      - name: Run deduplicator
        if: steps.gate.outputs.changed == 'true'
        run: Rscript --vanilla code/0-287g-deduplicate.R

      - name: Check for changes
        if: steps.gate.outputs.changed == 'true'
        id: check_changes
        run: |
          git add agreements/ sheets/

          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Generate change summary comparing old vs new files
          Rscript --vanilla code/0-287g-diff.R

          # If files changed but contents are identical after deduplication, skip
          if grep -qF 'NO_REAL_CHANGES' /tmp/287g-changes.txt; then
            echo "Files differ but contents are identical — skipping."
            git reset HEAD -- agreements/ sheets/
            git checkout -- agreements/ sheets/
            # checkout restores tracked files only; also drop the untracked
            # snapshot folders this run created, or they leak into tomorrow
            git clean -fd agreements/ sheets/
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run CI-friendly data pipeline
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          bash code/run_ci.sh
          git add data/

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update 287(g) agreement files [skip ci]"
          git push --set-upstream origin HEAD

      - name: Create or update pull request
        if: steps.check_changes.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated update: changes detected in 287(g) agreement files."
            echo ""
            cat /tmp/287g-changes.txt
          } > /tmp/pr-body.txt
          head -c 60000 /tmp/pr-body.txt > /tmp/pr-body.trimmed.txt
          if [ "$(wc -c < /tmp/pr-body.txt)" -gt 60000 ]; then
            printf "\n\n_...truncated at 60k chars._\n" >> /tmp/pr-body.trimmed.txt
          fi

          if [ "${{ steps.update_branch.outputs.existing_pr }}" = "true" ]; then
            # each day's incremental diff lands as a comment on the open PR
            # (the snapshot step captured the PR branch's state, so the diff
            # covers only what this run added)
            pr_num=$(gh pr list --state open \
              --head "${{ steps.update_branch.outputs.branch }}" \
              --json number --jq '.[0].number')
            gh pr comment "$pr_num" --body-file /tmp/pr-body.trimmed.txt
            gh pr edit "$pr_num" \
              --title "287(g) update through $(date +%Y-%m-%d)"
            pr_url=$(gh pr view "$pr_num" --json url --jq .url)
          else
            pr_url=$(gh pr create \
              --title "287(g) update $(date +%Y-%m-%d)" \
              --body-file /tmp/pr-body.trimmed.txt \
              --base main)
            pr_num="${pr_url##*/}"
          fi
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"

      - name: Trigger diff workflow
        if: steps.create_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=diff-pr \
            -F "client_payload[pr_number]=${{ steps.create_pr.outputs.pr_number }}"

      - name: Clean up temp files
        if: always()
        run: rm -rf /tmp/old-287g /tmp/287g-changes.txt /tmp/pr-body*.txt
