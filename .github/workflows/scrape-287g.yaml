name: "Scrape 287(g) agreements"

on:
  schedule:
    # hourly through the US working day: ICE sometimes replaces the sheet more
    # than once a day (the archive holds am/pm pairs), and every "as of" time it
    # has stamped on a list falls between 9 am and 7 pm Eastern. Cron is UTC and
    # ignores daylight saving, so the window is 10:00 to 01:00 UTC: 6 am to 9 pm
    # Eastern in summer, 5 am to 8 pm in winter. The sheet check keeps unchanged
    # runs to two small requests plus a sharded revalidation of the MOA pdfs.
    # minute 17 avoids the top-of-the-hour scheduling pile-up
    - cron: '17 10-23,0-1 * * *'
  workflow_dispatch:
    inputs:
      full_pass:
        description: "revalidate every MOA url, not just this hour's shard"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# never cancel a run mid-scrape; a newer tick queues behind it
concurrency:
  group: 287g-acquire
  cancel-in-progress: false

jobs:
  # Everything ICE published is committed and pushed here, before any pipeline
  # code runs, so a red data build can never discard an acquisition.
  acquire:
    runs-on: [self-hosted]
    timeout-minutes: 150
    outputs:
      branch: ${{ steps.update_branch.outputs.branch }}
      changed: ${{ steps.check_changes.outputs.changed }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          lfs: true
          fetch-depth: 0

      - name: Continue open update PR if one exists
        id: update_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # While an agreements-update PR sits unmerged, build on its branch so
          # each run's changes land as a new commit there.
          open_branch=$(gh pr list --state open --json headRefName \
            --jq '[.[].headRefName | select(startswith("agreements-update"))][0] // empty')
          if [ -n "$open_branch" ]; then
            git fetch origin "$open_branch"
            git checkout -B "$open_branch" "origin/$open_branch"
            echo "Continuing open update branch: $open_branch"
            echo "branch=$open_branch" >> "$GITHUB_OUTPUT"
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
          else
            branch="agreements-update-$(date +%Y-%m-%d-%H%M%S)"
            git checkout -b "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "existing_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the ICE sheet changed (quick check)
        id: sheet_check
        run: |
          # ICE links the workbook either by its doclib name or through a
          # file-download id (the 08/25, 08/28 and 09/04 2026 lists); the same
          # two forms 0-acquire-scraper.R accepts
          # Fetch just the participating-agencies sheet and compare its hash to
          # the archive. Any failure falls through to a full scrape.
          ua="Mozilla/5.0 (X11; Linux aarch64) AppleWebKit/537.36"
          url=$(curl -sL --retry 3 -A "$ua" "https://www.ice.gov/identify-and-arrest/287g" \
            | grep -oiE 'href="[^"]*(participatingAgencies[^"]*\.xlsx|file-download/download/public/[0-9]+)[^"]*"' \
            | head -1 | sed 's/^href="//; s/"$//' || true)
          case "$url" in
            //*) url="https:$url" ;;
            /*)  url="https://www.ice.gov$url" ;;
          esac
          if [ -z "$url" ]; then
            echo "Sheet link not found on page — running full scrape."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -sL -f --retry 3 -A "$ua" "$url" -o "$RUNNER_TEMP/sheet-check.xlsx"; then
            echo "Sheet check download failed — running full scrape."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_hash=$(sha256sum "$RUNNER_TEMP/sheet-check.xlsx" | cut -d' ' -f1)
          echo "sheet_hash=$new_hash" >> "$GITHUB_OUTPUT"
          # a failed PDF download is retried on the next tick, not the next sheet edit
          if find agreements -name failed_downloads.txt -size +0 2>/dev/null | grep -q .; then
            echo "Outstanding failed downloads — running full scrape."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest_dir=$(ls -d sheets/sheets_2* 2>/dev/null | sort | tail -1 || true)
          today=$(date -u +%Y-%m-%d)
          # a folder's hashes are in its manifest.csv, or in a download_path_log.csv where it has that instead
          if [ -n "$newest_dir" ] && cat "$newest_dir"/manifest.csv "$newest_dir"/download_path_log.csv 2>/dev/null | grep -q "$new_hash"; then
            echo "Sheet unchanged (sha256 $new_hash) — skipping scrape."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif cat sheets/sheets_2*/manifest.csv sheets/sheets_2*/download_path_log.csv 2>/dev/null | grep -q "$new_hash"; then
            # ICE is re-serving an older sheet. Record that once per day (the row is
            # appended after the clean-tree step, or it would be wiped) and let the run
            # proceed so it is committed; the sheet itself collapses as a duplicate.
            if grep -qs "^$today,$new_hash," sheets/seen-log.csv; then
              echo "Sheet reverted to $new_hash, already logged today — skipping."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Sheet reverted to a previously seen hash — logging and scraping."
              echo "event=revert" >> "$GITHUB_OUTPUT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Sheet changed or no prior snapshot — running full scrape."
            echo "event=new" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure clean working tree
        run: |
          git lfs pull
          git checkout -- .
          # the runner is persistent; drop anything git doesn't track before acquiring
          git clean -fd agreements/ sheets/ manifests/

      - name: Record the sheet event
        if: steps.sheet_check.outputs.event != ''
        run: |
          # one row per distinct (day, sheet hash): evidence of what ICE served when
          [ -f sheets/seen-log.csv ] || echo "date,sheet_hash,event" > sheets/seen-log.csv
          echo "$(date -u +%Y-%m-%d),${{ steps.sheet_check.outputs.sheet_hash }},${{ steps.sheet_check.outputs.event }}" >> sheets/seen-log.csv

      - name: Install R packages
        run: |
          Rscript --vanilla -e '
            pkgs <- c(
              "arrow", "digest", "dplyr", "fs", "haven", "httr", "httr2", "openxlsx",
              "readr", "readxl", "rvest", "sf", "stringi", "stringdist",
              "stringr", "tidygeocoder", "tigris", "tidyr", "tidyverse", "xml2"
            )
            # the self-hosted runner keeps its library between runs; a full
            # reinstall recompiles arrow from source (~50 min), so only fetch
            # what is missing (delete the package from the library to force a
            # version refresh)
            missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing) > 0) {
              install.packages(missing, repos = "https://cloud.r-project.org")
            }
          '

      - name: Snapshot the sheet
        if: steps.sheet_check.outputs.changed == 'true'
        run: Rscript --vanilla code/0-acquire-scraper.R

      - name: Revalidate MOA documents
        env:
          # every url when the sheet changed or failures are outstanding; one shard
          # of six otherwise (hour mod 6), so the 16 daily runs still cover every url
          MOA_FULL: ${{ (steps.sheet_check.outputs.changed == 'true' || inputs.full_pass == true) && '1' || '' }}
        run: |
          export MOA_SHARD=$(( 10#$(date -u +%H) % 6 ))
          Rscript --vanilla code/0-acquire-moa-pass.R

      - name: Run deduplicator
        run: Rscript --vanilla code/0-acquire-dedupe.R

      - name: Check for changes
        id: check_changes
        run: |
          git add agreements/ sheets/ manifests/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          Rscript --vanilla code/0-acquire-diff.R
          if grep -qF 'NO_REAL_CHANGES' "$RUNNER_TEMP/287g-changes.txt"; then
            echo "Only the pass log moved — nothing to commit."
            git reset HEAD -- agreements/ sheets/ manifests/
            git checkout -- agreements/ sheets/ manifests/
            git clean -fd agreements/ sheets/ manifests/
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the acquisition
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update 287(g) agreement files [skip ci]"
          git push --set-upstream origin HEAD

      - name: Create or update pull request
        if: steps.check_changes.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated update: changes detected in 287(g) agreement files."
            echo ""
            cat "$RUNNER_TEMP/287g-changes.txt"
          } > "$RUNNER_TEMP/pr-body.txt"
          head -c 60000 "$RUNNER_TEMP/pr-body.txt" > "$RUNNER_TEMP/pr-body.trimmed.txt"
          if [ "$(wc -c < "$RUNNER_TEMP/pr-body.txt")" -gt 60000 ]; then
            printf "\n\n_...truncated at 60k chars._\n" >> "$RUNNER_TEMP/pr-body.trimmed.txt"
          fi
          if [ "${{ steps.update_branch.outputs.existing_pr }}" = "true" ]; then
            pr_num=$(gh pr list --state open \
              --head "${{ steps.update_branch.outputs.branch }}" \
              --json number --jq '.[0].number')
            gh pr comment "$pr_num" --body-file "$RUNNER_TEMP/pr-body.trimmed.txt"
            gh pr edit "$pr_num" --title "287(g) update through $(date +%Y-%m-%d)"
          else
            pr_url=$(gh pr create \
              --title "287(g) update $(date +%Y-%m-%d)" \
              --body-file "$RUNNER_TEMP/pr-body.trimmed.txt" \
              --base main)
            pr_num="${pr_url##*/}"
          fi
          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"

      - name: Clean up temp files
        if: always()
        run: rm -f "$RUNNER_TEMP"/sheet-check.xlsx "$RUNNER_TEMP"/287g-changes.txt "$RUNNER_TEMP"/pr-body*.txt

  # The data build runs against the pushed acquisition on a GitHub-hosted
  # runner; its failure costs one build, never a snapshot. Ubuntu's GDAL has no
  # Parquet driver, so the build uses Homebrew's GDAL (built with Arrow, the
  # same build as on a Mac). R comes from Homebrew too: a system R already
  # holds Ubuntu's copies of libraries GDAL needs newer versions of (libtiff,
  # pcre2, libjpeg), and the loader will not load a second copy under the same
  # name, so R, GDAL and every compiled package must share one set of libraries.
  build:
    needs: acquire
    if: needs.acquire.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # packages compile from CRAN source against Homebrew's libraries; Posit's
      # Ubuntu binaries would link Ubuntu's GDAL (no Parquet driver) instead
      RENV_CONFIG_PPM_ENABLED: "FALSE"
      RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.acquire.outputs.branch }}
          lfs: false

      # the build reads the sheets, the inputs and the agreement manifests; the
      # MOA pdfs (12 GB) stay as pointers. The inputs rarely change, so their
      # LFS objects are cached rather than downloaded on every build
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-inputs-${{ hashFiles('inputs/**') }}
          restore-keys: lfs-inputs-

      - name: Pull the LFS files the build reads
        run: |
          git lfs install --local
          git lfs pull --include="sheets/**,inputs/**"

      - name: Install Homebrew GDAL and R
        id: brew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # udunits (units) and libuv (fs) are the only system libraries
          # renv.lock's packages need that GDAL and R don't already bring
          brew install gdal r udunits libuv
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          # the package cache is keyed on these, so a GDAL or R upgrade recompiles
          echo "versions=$(brew list --versions r gdal apache-arrow | tr ' \n' '-_')" >> "$GITHUB_OUTPUT"
          {
            # every compile in this job finds Homebrew's headers and libraries
            # (LIBRARY_PATH and CPATH), resolves what those libraries themselves
            # need (LD_RUN_PATH, which the linker searches for a library's
            # dependencies and records as the run-time search path), and links
            # the arrow package to Homebrew's libarrow, the copy GDAL uses
            echo "PKG_CONFIG_PATH=$HOMEBREW_PREFIX/lib/pkgconfig"
            echo "LIBRARY_PATH=$HOMEBREW_PREFIX/lib"
            echo "LD_RUN_PATH=$HOMEBREW_PREFIX/lib"
            echo "CPATH=$HOMEBREW_PREFIX/include"
            echo "ARROW_USE_PKG_CONFIG=true"
            echo "MAKEFLAGS=-j$(nproc)"
          } >> "$GITHUB_ENV"
          Rscript --vanilla -e 'cat(R.version.string, "\n"); print(Sys.which(c("gcc", "gdal-config")))'

      # renv::restore() from renv.lock, cached. No binaries exist for Homebrew's
      # R, so the first run after a cache miss compiles every package (~15 min)
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: ${{ steps.brew.outputs.versions }}

      - name: Check sf reads Parquet and arrow links Homebrew
        run: |
          Rscript -e '
            stopifnot("Parquet" %in% rownames(sf::st_drivers()))
            print(sf::sf_extSoftVersion())
            cat("arrow", as.character(packageVersion("arrow")), "\n")
          '
          ldd "$(Rscript -e 'cat(system.file("libs", "arrow.so", package = "arrow"))')" | grep -i arrow

      - name: Build the datasets
        env:
          # a tripped invariant fails this job, and only this job
          QA_STRICT: "1"
        run: bash code/run_ci.sh

      - name: Commit and push the datasets
        run: |
          git add data/
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --cached --quiet; then
            echo "Datasets unchanged."
          else
            git commit -m "Update 287(g) datasets [skip ci]"
            git push origin HEAD
          fi

      - name: Trigger diff workflow
        if: needs.acquire.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=diff-pr \
            -F "client_payload[pr_number]=${{ needs.acquire.outputs.pr_number }}"

      - name: Report a failed build on the PR
        if: failure() && needs.acquire.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ needs.acquire.outputs.pr_number }}" --body \
            "Data build failed at $(git rev-parse --short HEAD); the raw snapshot is committed on this branch. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
