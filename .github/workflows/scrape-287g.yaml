name: "Scrape 287(g) agreements"

on:
  schedule:
    - cron: '0 8 * * *' # every day at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run scrape + pipeline but skip commit/push/PR (for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# one scrape at a time; a manual dispatch overlapping the cron queues instead
# of racing on the branch/push
concurrency:
  group: scrape-287g
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted]
    timeout-minutes: 120

    env:
      RENV_PATHS_CACHE: ~/renv-cache
      RENV_CONFIG_PPM_ENABLED: FALSE
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/manylinux_2_28/latest

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          lfs: true
          fetch-depth: 0

      - name: Ensure clean working tree and save current snapshot
        run: |
          git lfs pull
          git checkout -- .
          mkdir -p /tmp/old-287g
          Rscript --vanilla -e '
            snapshot <- function(base_path, out_path) {
              if (!dir.exists(base_path)) {
                saveRDS(data.frame(
                  rel_path = character(),
                  file_hash = character(),
                  stringsAsFactors = FALSE
                ), out_path)
                return()
              }

              files <- list.files(base_path, recursive = TRUE, full.names = TRUE)
              files <- files[!file.info(files)$isdir]
              rel_paths <- substring(files, nchar(base_path) + 2)

              saveRDS(data.frame(
                rel_path = rel_paths,
                file_hash = unname(tools::md5sum(files)),
                stringsAsFactors = FALSE
              ), out_path)
            }

            snapshot("agreements", "/tmp/old-287g/agreements.rds")
            snapshot("sheets", "/tmp/old-287g/sheets.rds")
          '

      - name: Restore R packages (renv)
        # no --vanilla here: the project .Rprofile bootstraps renv itself.
        # Exporting R_LIBS makes every later `Rscript --vanilla` step (and
        # run_ci.sh, which disables the renv autoloader) resolve packages from
        # the renv project library instead of reinstalling anything.
        run: |
          uname -sm
          Rscript -e 'renv::hydrate(); renv::restore(prompt = FALSE)'
          echo "R_LIBS=$(Rscript -e 'cat(renv::paths$library())')" >> "$GITHUB_ENV"

      - name: Run scraper
        # the ICE site is flaky; retry transient failures before giving up
        run: |
          for attempt in 1 2 3; do
            Rscript --vanilla code/0-287g-scraper.R && exit 0
            echo "::warning::scrape attempt ${attempt} failed"
            sleep 60
          done
          exit 1

      - name: Run deduplicator
        run: Rscript --vanilla code/0-287g-deduplicate.R

      - name: Check for changes
        id: check_changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b agreements-update-$(date +%Y-%m-%d-%H%M%S)
          git add agreements/ sheets/

          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if any open PR already contains these files
          changed_files=$(git diff --cached --name-only)
          open_prs=$(gh pr list --state open --json number --jq '.[].number')
          for pr in $open_prs; do
            pr_files=$(gh pr view "$pr" --json files --jq '.files[].path')
            for file in $changed_files; do
              if echo "$pr_files" | grep -qF "$file"; then
                echo "File '$file' already present in open PR #$pr — skipping."
                echo "changed=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            done
          done

          # Generate change summary comparing old vs new files
          Rscript --vanilla code/0-287g-diff.R

          # If files changed but contents are identical after deduplication, skip
          if grep -qF 'NO_REAL_CHANGES' /tmp/287g-changes.txt; then
            echo "Files differ but contents are identical — skipping."
            git reset HEAD -- agreements/ sheets/
            git checkout -- agreements/ sheets/
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run CI-friendly data pipeline
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          bash code/run_ci.sh
          git add data/

      - name: Upload QA review files
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-review-${{ github.run_id }}
          path: data/*.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update 287(g) agreement files [skip ci]"
          git push --set-upstream origin HEAD

      - name: Create pull request
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated update: changes detected in 287(g) agreement files."
            echo ""
            cat /tmp/287g-changes.txt
          } > /tmp/pr-body.txt
          head -c 60000 /tmp/pr-body.txt > /tmp/pr-body.trimmed.txt
          if [ "$(wc -c < /tmp/pr-body.txt)" -gt 60000 ]; then
            printf "\n\n_...truncated at 60k chars._\n" >> /tmp/pr-body.trimmed.txt
          fi

          pr_url=$(gh pr create \
            --title "287(g) update $(date +%Y-%m-%d)" \
            --body-file /tmp/pr-body.trimmed.txt \
            --base main)
          pr_num="${pr_url##*/}"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"

      - name: Trigger diff workflow
        if: steps.create_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=diff-pr \
            -F "client_payload[pr_number]=${{ steps.create_pr.outputs.pr_number }}"

      - name: Clean up temp files
        if: always()
        run: rm -rf /tmp/old-287g /tmp/287g-changes.txt /tmp/pr-body*.txt

  # second safety layer beyond the inline scraper retry: rerun failed jobs
  # up to two more times (transient runner/network trouble)
  rerun-on-failure:
    needs: [scrape]
    if: failure() && fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.run_id }} --failed
