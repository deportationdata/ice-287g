name: "Scrape 287(g) agreements"

on:
  schedule:
    - cron: '0 8 * * *' # every day at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          lfs: true
          fetch-depth: 0

      - name: Ensure clean working tree and save current snapshot
        run: |
          git lfs pull
          git checkout -- .
          mkdir -p /tmp/old-287g
          cp -r agreements /tmp/old-287g/agreements 2>/dev/null || true
          cp -r sheets /tmp/old-287g/sheets 2>/dev/null || true

      - name: Install R packages
        run: |
          Rscript --vanilla -e '
            install.packages(
              c(
                "arrow",
                "digest",
                "dplyr",
                "httr",
                "openxlsx",
                "readr",
                "readxl",
                "rvest",
                "sf",
                "sfarrow",
                "stringdist",
                "stringr",
                "tigris",
                "tidyr",
                "tidyverse"
              ),
              repos = "https://cloud.r-project.org"
            )
          '

      - name: Run scraper
        run: Rscript --vanilla code/0-287g-scraper.R

      - name: Run deduplicator
        run: Rscript --vanilla code/0-287g-deduplicate.R

      - name: Check for changes
        id: check_changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b agreements-update-$(date +%Y-%m-%d-%H%M%S)
          git add agreements/ sheets/

          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if any open PR already contains these files
          changed_files=$(git diff --cached --name-only)
          open_prs=$(gh pr list --state open --json number --jq '.[].number')
          for pr in $open_prs; do
            pr_files=$(gh pr view "$pr" --json files --jq '.files[].path')
            for file in $changed_files; do
              if echo "$pr_files" | grep -qF "$file"; then
                echo "File '$file' already present in open PR #$pr — skipping."
                echo "changed=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            done
          done

          # Generate change summary comparing old vs new files
          Rscript --vanilla code/0-287g-diff.R

          # If files changed but contents are identical after deduplication, skip
          if grep -qF 'NO_REAL_CHANGES' /tmp/287g-changes.txt; then
            echo "Files differ but contents are identical — skipping."
            git reset HEAD -- agreements/ sheets/
            git checkout -- agreements/ sheets/
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run CI-friendly data pipeline
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          bash code/run_ci.sh
          git add data/

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update 287(g) agreement files [skip ci]"
          git push --set-upstream origin HEAD

      - name: Create pull request
        if: steps.check_changes.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated update: changes detected in 287(g) agreement files."
            echo ""
            cat /tmp/287g-changes.txt
          } > /tmp/pr-body.txt
          head -c 60000 /tmp/pr-body.txt > /tmp/pr-body.trimmed.txt
          if [ "$(wc -c < /tmp/pr-body.txt)" -gt 60000 ]; then
            printf "\n\n_...truncated at 60k chars._\n" >> /tmp/pr-body.trimmed.txt
          fi

          pr_url=$(gh pr create \
            --title "287(g) update $(date +%Y-%m-%d)" \
            --body-file /tmp/pr-body.trimmed.txt \
            --base main)
          pr_num="${pr_url##*/}"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"

      - name: Trigger diff workflow
        if: steps.create_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=diff-pr \
            -F "client_payload[pr_number]=${{ steps.create_pr.outputs.pr_number }}"

      - name: Clean up temp files
        if: always()
        run: rm -rf /tmp/old-287g /tmp/287g-changes.txt /tmp/pr-body*.txt
