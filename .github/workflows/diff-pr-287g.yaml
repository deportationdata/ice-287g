name: "Diff 287(g) agreements on PR"

on:
  repository_dispatch:
    types: [diff-pr]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'data/intermediate/match-all-features.parquet'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to diff'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      # the runner context is not available in a job-level env; the workspace is
      RENV_PATHS_ROOT: ${{ github.workspace }}/.renv-root

    steps:
      - name: Resolve PR ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)   num="${{ github.event.inputs.pr_number }}" ;;
            repository_dispatch) num="${{ github.event.client_payload.pr_number }}" ;;
            *)                   num="${{ github.event.pull_request.number }}" ;;
          esac
          ref=$(gh api "repos/${REPO}/pulls/${num}" --jq .head.sha)
          echo "number=${num}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
          lfs: false
          sparse-checkout: |
            code/diff-agreements-pr.R
            data/intermediate/match-all-features.parquet
            data/qa/qa-summary.csv
            renv.lock
            renv/activate.R
            renv/settings.json
            .Rprofile
          sparse-checkout-cone-mode: false

      - name: Checkout main into _main/
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          lfs: false
          # every path the feature layer is committed under on main
          sparse-checkout: |
            data/intermediate/match-all-features.parquet
            data/intermediate/all_agreements_sf.parquet
            data/all_agreements_sf.parquet
            data/qa/qa-summary.csv
          sparse-checkout-cone-mode: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      # only the four packages the diff needs; the rest of renv.lock wants GDAL
      - name: Cache the renv library
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RENV_PATHS_ROOT }}
            renv/library
          key: diff-renv-${{ runner.os }}-R4.6.0-${{ hashFiles('renv.lock') }}

      - name: Restore the diff script's packages from renv.lock
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
        run: Rscript -e 'renv::restore(packages = c("arrow", "dplyr", "tidyr", "stringr"))'

      - name: Run diff script
        run: |
          main_sf=_main/data/intermediate/match-all-features.parquet
          [ -f "$main_sf" ] || main_sf=_main/data/intermediate/all_agreements_sf.parquet
          [ -f "$main_sf" ] || main_sf=_main/data/all_agreements_sf.parquet
          Rscript code/diff-agreements-pr.R \
            "$main_sf" \
            data/intermediate/match-all-features.parquet \
            > /tmp/pr-diff-comment.md
          # the QA invariants ship as a CSV so their diff reads inline
          if [ -f _main/data/qa/qa-summary.csv ] && [ -f data/qa/qa-summary.csv ]; then
            if ! diff -u _main/data/qa/qa-summary.csv data/qa/qa-summary.csv > /tmp/qa-summary.diff; then
              { printf "\n\n### QA summary changes\n\n\`\`\`diff\n"; cat /tmp/qa-summary.diff; printf "\`\`\`\n"; } \
                >> /tmp/pr-diff-comment.md
            else
              printf "\n\n_QA summary unchanged._\n" >> /tmp/pr-diff-comment.md
            fi
          fi
          head -c 60000 /tmp/pr-diff-comment.md > /tmp/pr-diff-comment.trimmed.md
          if [ $(wc -c < /tmp/pr-diff-comment.md) -gt 60000 ]; then
            printf "\n\n_...truncated at 60k chars._\n" >> /tmp/pr-diff-comment.trimmed.md
          fi

      - name: Post or update comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body != null and (.body | contains("<!-- pr-diff-bot -->"))) | .id')
          primary=$(echo "$ids" | head -n 1)
          echo "pr-diff-bot comments found: $(echo "$ids" | grep -c .) ; primary: '${primary:-none}'"

          echo "$ids" | tail -n +2 | while read -r id; do
            [ -n "$id" ] || continue
            echo "Deleting duplicate pr-diff-bot comment ${id}"
            gh api -X DELETE "repos/${REPO}/issues/comments/${id}" >/dev/null || true
          done

          jq -Rs '{body: .}' < /tmp/pr-diff-comment.trimmed.md > /tmp/pr-comment-body.json

          if [ -n "$primary" ]; then
            echo "Patching primary comment ${primary}"
            gh api -X PATCH "repos/${REPO}/issues/comments/${primary}" \
              --input /tmp/pr-comment-body.json > /dev/null
          else
            echo "Creating new comment"
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --input /tmp/pr-comment-body.json > /dev/null
          fi
